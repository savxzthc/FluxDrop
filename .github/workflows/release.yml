name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: npm run release:check -- ${{ github.ref_name }}

      - name: Build installers and portable executable
        run: |
          npm run tauri build -- --bundles nsis,msi
          npm run tauri build -- --no-bundle

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $assets = "release-assets"
          New-Item -ItemType Directory -Path $assets -Force | Out-Null

          Copy-Item "src-tauri/target/release/bundle/nsis/FluxDrop_${version}_x64-setup.exe" $assets
          Copy-Item "src-tauri/target/release/bundle/msi/FluxDrop_${version}_x64_en-US.msi" $assets
          Copy-Item "src-tauri/target/release/fluxdrop.exe" "$assets/FluxDrop_${version}_x64-portable.exe"

          Get-ChildItem $assets -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } |
            Set-Content "$assets/SHA256SUMS.txt" -Encoding utf8

          @"
          Download ``FluxDrop_${version}_x64-setup.exe`` for the normal Windows installation experience.
          Use the MSI package for managed deployment, or ``FluxDrop_${version}_x64-portable.exe`` to run FluxDrop without installing it.

          The portable executable requires the Microsoft Edge WebView2 Runtime included with supported Windows 10 and 11 installations.

          These binaries are unsigned, so Windows SmartScreen may ask for confirmation. Verify downloads against ``SHA256SUMS.txt``.
          "@ | Set-Content "release-notes.md" -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" `
            --verify-tag `
            --title "FluxDrop ${{ github.ref_name }}" `
            --notes-file "release-notes.md" `
            "release-assets/FluxDrop_${version}_x64-setup.exe" `
            "release-assets/FluxDrop_${version}_x64_en-US.msi" `
            "release-assets/FluxDrop_${version}_x64-portable.exe" `
            "release-assets/SHA256SUMS.txt"

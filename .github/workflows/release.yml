name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: npm run release:check -- ${{ github.ref_name }}

      - name: Configure updater public key
        shell: pwsh
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PUBLIC_KEY)) {
            throw "TAURI_SIGNING_PUBLIC_KEY is not configured."
          }
          @{
            plugins = @{
              updater = @{
                pubkey = $env:TAURI_SIGNING_PUBLIC_KEY
              }
            }
          } |
            ConvertTo-Json -Depth 4 |
            Set-Content "src-tauri/tauri.release.conf.json" -Encoding utf8

      - name: Build installers and portable executable
        env:
          FLUXDROP_BUILD_FLAVOR: installed
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          npm run tauri build -- --bundles nsis,msi --config src-tauri/tauri.release.conf.json

      - name: Build portable executable
        env:
          FLUXDROP_BUILD_FLAVOR: portable
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: npm run tauri build -- --no-bundle --config src-tauri/tauri.release.conf.json

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $assets = "release-assets"
          New-Item -ItemType Directory -Path $assets -Force | Out-Null

          $nsis = Get-Item "src-tauri/target/release/bundle/nsis/FluxDrop_${version}_x64-setup.exe"
          $msi = Get-Item "src-tauri/target/release/bundle/msi/FluxDrop_${version}_x64_en-US.msi"
          Copy-Item $nsis.FullName $assets
          Copy-Item $msi.FullName $assets
          Copy-Item "src-tauri/target/release/fluxdrop.exe" "$assets/FluxDrop_${version}_x64-portable.exe"

          $nsisSignaturePath = "$($nsis.FullName).sig"
          $msiSignaturePath = "$($msi.FullName).sig"
          if (-not (Test-Path $nsisSignaturePath)) { throw "The NSIS updater signature was not generated." }
          if (-not (Test-Path $msiSignaturePath)) { throw "The MSI updater signature was not generated." }
          Copy-Item $nsisSignaturePath $assets
          Copy-Item $msiSignaturePath $assets
          $signature = (Get-Content -Raw $nsisSignaturePath).Trim()
          $manifest = [ordered]@{
            version = $version
            notes = "FluxDrop ${{ github.ref_name }} reliability release"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "https://github.com/savxzthc/FluxDrop/releases/download/${{ github.ref_name }}/$($nsis.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content "$assets/latest.json" -Encoding utf8
          npm run updater:validate -- "$assets/latest.json"

          Get-ChildItem $assets -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } |
            Set-Content "$assets/SHA256SUMS.txt" -Encoding utf8

          @"
          Download ``FluxDrop_${version}_x64-setup.exe`` for the normal Windows installation experience.
          Use the MSI package for managed deployment, or ``FluxDrop_${version}_x64-portable.exe`` to run FluxDrop without installing it.

          The portable executable requires the Microsoft Edge WebView2 Runtime included with supported Windows 10 and 11 installations.

          Application installers are update-signed, but they are not Authenticode-signed. Windows SmartScreen may still ask for confirmation. Verify downloads against ``SHA256SUMS.txt``.
          "@ | Set-Content "release-notes.md" -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" `
            --verify-tag `
            --title "FluxDrop ${{ github.ref_name }}" `
            --notes-file "release-notes.md" `
            "release-assets/FluxDrop_${version}_x64-setup.exe" `
            "release-assets/FluxDrop_${version}_x64_en-US.msi" `
            "release-assets/FluxDrop_${version}_x64-portable.exe" `
            "release-assets/FluxDrop_${version}_x64-setup.exe.sig" `
            "release-assets/FluxDrop_${version}_x64_en-US.msi.sig" `
            "release-assets/SHA256SUMS.txt" `
            "release-assets/latest.json"

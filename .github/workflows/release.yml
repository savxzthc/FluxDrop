name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: npm run release:check -- ${{ github.ref_name }}

      - name: Build installers and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: FluxDrop v__VERSION__
          releaseBody: |
            Download the NSIS setup executable for the normal Windows installation experience.
            The MSI package is also provided for managed deployments.

            This release is unsigned, so Windows SmartScreen may ask for confirmation.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi

[package]
name = "fluxdrop"
version = "0.4.0"
description = "Send files from your PC to your phone with one QR scan."
authors = ["FluxDrop Contributors"]
license = "MIT"
repository = "https://github.com/savxzthc/FluxDrop"
edition = "2021"

[lib]
name = "fluxdrop_lib"
path = "src/lib.rs"

[[bin]]
name = "fluxdrop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-stream = "0.3"
async_zip = { version = "0.0.18", features = ["tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
axum = { version = "0.7", features = ["multipart"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
headers = "0.4"
futures-lite = "2"
http = "1"
local-ip-address = "0.6"
mime_guess = "2"
percent-encoding = "2"
qrcode = "0.14"
rand = "0.8"
rcgen = { version = "0.14", features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tower-http = { version = "0.5", features = ["set-header", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider"] }
tower = { version = "0.5", features = ["util"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

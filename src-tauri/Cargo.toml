[package]
name = "fluxdrop"
version = "0.1.0"
description = "Send files from your PC to your phone with one QR scan."
authors = ["FluxDrop Contributors"]
license = "MIT"
repository = "https://github.com/fluxdrop/fluxdrop"
edition = "2021"

[lib]
name = "fluxdrop_lib"
path = "src/lib.rs"

[[bin]]
name = "fluxdrop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-stream = "0.3"
axum = "0.7"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
headers = "0.4"
http = "1"
local-ip-address = "0.6"
mime_guess = "2"
percent-encoding = "2"
qrcode = "0.14"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.5", features = ["set-header", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
